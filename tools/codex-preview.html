<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cell War · 细胞图鉴原型</title>
<style>
@font-face{font-family:px;src:url('../game/assets/fonts/fusion_pixel_10px.ttf')}*{box-sizing:border-box}body{margin:0;background:#10171d;color:#eaf8fc;font:14px px,monospace}button,input{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #35515b;padding-bottom:18px;margin-bottom:18px}.eyebrow,.accent{color:#30d1fa}.title{font-size:28px;margin:8px 0}.sub{color:#86a0aa;line-height:1.7;margin:0}.search{width:280px;background:#17232b;border:1px solid #35515b;padding:11px 13px}.layout{display:grid;grid-template-columns:210px 340px 1fr;gap:14px;min-height:650px}.panel{background:#17232b;border:1px solid #2c4650}.panel-head{padding:14px;border-bottom:1px solid #2c4650}.panel-head h2{font-size:15px;margin:0 0 7px}.muted{color:#86a0aa;font-size:11px}.filters{padding:10px;display:grid;gap:7px}.filter{border:1px solid transparent;background:transparent;text-align:left;padding:10px}.filter:hover,.filter.active{border-color:#30d1fa;background:#20323c}.filter small{display:block;color:#86a0aa;margin-top:5px}.list{padding:8px;display:grid;gap:6px;max-height:560px;overflow:auto}.item{border:1px solid #2c4650;background:#1b2a33;text-align:left;padding:10px;display:grid;grid-template-columns:40px 1fr;gap:9px}.item:hover,.item.active{border-color:#eaf8fc;transform:translateX(2px)}.item-icon{width:36px;height:36px;background:#0f1822;display:grid;place-items:center;color:#30d1fa;font-size:18px;border:1px solid #35515b}.item b{font-size:13px}.item small{display:block;color:#86a0aa;margin-top:5px;line-height:1.5}.detail{padding:18px;display:grid;grid-template-columns:minmax(340px,1fr) 260px;gap:18px}.stage{background:#0b1118;border:1px solid #35515b;min-height:410px;display:grid;place-items:center;position:relative;overflow:hidden}.stage:before{content:'';position:absolute;inset:12px;background:linear-gradient(#0f1822 1px,transparent 1px),linear-gradient(90deg,#0f1822 1px,transparent 1px);background-size:24px 24px;opacity:.45}.orbit{width:130px;height:130px;border:2px solid #30d1fa;position:relative;z-index:1;animation:spin 5s linear infinite}.orbit:before,.orbit:after{content:'';position:absolute;background:#eaf8fc}.orbit:before{width:18px;height:18px;left:54px;top:54px}.orbit:after{width:8px;height:8px;left:12px;top:12px;box-shadow:94px 94px #30d1fa}.stage-label{position:absolute;bottom:16px;left:18px;color:#86a0aa;font-size:11px;z-index:2}.info h2{margin:0 0 7px;font-size:23px}.pill{display:inline-block;border:1px solid #35515b;color:#30d1fa;padding:4px 7px;margin:8px 5px 14px 0;font-size:10px}.info p{color:#b3cbd1;line-height:1.8}.rule{border-top:1px solid #2c4650;padding-top:12px;margin-top:18px}.phase{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.phase button{background:#1b2a33;border:1px solid #35515b;padding:7px 8px;font-size:11px}.phase button.active{border-color:#eaf8fc;color:#30d1fa}.cards{border-top:1px solid #2c4650;margin-top:18px;padding-top:14px}.card{border:1px solid #35515b;padding:9px;margin-top:7px;background:#1b2a33}.card b{color:#eaf8fc}.card small{color:#86a0aa;display:block;line-height:1.5;margin-top:5px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1050px){.layout{grid-template-columns:180px 280px 1fr}.detail{grid-template-columns:1fr}.stage{min-height:300px}}@media(max-width:720px){.app{padding:14px}.top{display:block}.search{width:100%;margin-top:14px}.layout{grid-template-columns:1fr}.filters{grid-template-columns:repeat(2,1fr)}.list{max-height:350px}.detail{padding:12px}}
</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">CELL WAR / CODEX PROTOTYPE</div><h1 class="title">细胞图鉴</h1><p class="sub">查看细胞身份、技能动画、效果描述与关联卡牌。</p></div><input id="search" class="search" placeholder="模糊搜索技能、卡牌、效果…" aria-label="搜索图鉴"></header><section class="layout"><aside class="panel"><div class="panel-head"><h2>细胞目录</h2><span class="muted">阵营 / 类型</span></div><div class="filters"><button class="filter active" data-f="all">全部细胞<small>免疫与癌症</small></button><button class="filter" data-f="immune">免疫细胞<small>B / T / 巨噬 / 树突</small></button><button class="filter" data-f="cancer">癌细胞<small>四种癌细胞</small></button><button class="filter" data-f="cards">卡牌效果<small>事件 / 即时 / 永久</small></button></div></aside><section class="panel"><div class="panel-head"><h2 id="listTitle">技能与卡牌</h2><span class="muted" id="result"></span></div><div class="list" id="list"></div></section><section class="panel detail"><div class="stage"><div class="orbit" id="orbit"></div><div class="stage-label" id="stageLabel">动画预览 · 点击阶段切换</div></div><div class="info"><div class="eyebrow" id="group"></div><h2 id="name"></h2><span class="pill" id="type"></span><span class="pill" id="cost"></span><p id="desc"></p><div class="rule"><strong>动画阶段</strong><div class="phase" id="phases"></div></div><div class="rule"><strong>效果说明</strong><p id="effect"></p></div><div class="cards"><strong>相关卡牌</strong><div id="cards"></div></div></div></section></section></main>
<script>
const skills=[
['move','迁移','免疫细胞 · 通用技能','主动技能','0.5 / 0.8','细胞向相邻健康组织或癌性组织移动，费用随目标组织和免疫记忆等级变化。','选择合法目标格，结算费用并在落点触发入格效果。',['出发','移动','落位'],['免疫增援','代谢适应']],
['draw','基因表达','免疫细胞 · 通用技能','主动技能','按规则','核内表达亮起，一张卡片从细胞上方浮出。','从当前阵营与阶段可用池抽取卡牌，效果以卡牌正文为准。',['表达启动','卡片出现','卡片停留'],['克隆扩增','IFN-γ释放']],
['differentiate','分化','免疫细胞 · 通用技能','主动技能','每局一次','未分化细胞转为 B、T、巨噬或树突细胞。','选择尚未被占用的免疫分化类型，每种类型全阵营唯一。',['未分化','形态转换','分化结果'],['免疫突触成熟']],
['antibody','抗体','B 细胞 · 专属技能','主动技能','1 能量','Y 形抗体飞向符合条件的癌细胞，命中后产生碎光。','对符合条件的癌细胞造成能量损失；无目标时净化癌组织。',['准备','飞行 / 命中','余光'],['抗体依赖细胞毒作用','中和抗体']],
['toxin','细胞毒素','T 细胞 · 专属技能','主动技能','1 能量','毒素覆盖一环七格，癌组织转为健康组织后留下坏死暗纹。','范围内癌细胞损失能量，新生健康组织保留坏死状态。',['七格提示','毒素释放','坏死残留'],['乳酸酸化']],
['lyse','裂解','T 细胞 · 专属技能','主动技能','1 能量','固化癌组织的骨质外壳裂开，碎片散去后显露组织。','处理相邻固化癌组织，裂纹与碎屑不代表额外伤害。',['锁定组织','外壳裂开','净化完成'],['基质降解']],
['phago','连续吞噬','巨噬细胞 · 专属技能','被动 / 反馈','被动','巨噬细胞连续扑向相邻组织，吞咬碎屑并逐步增强。','净化或成功攻击后恢复能量，实际恢复值由结算结果决定。',['强化启动','冲刺 / 咬合','强化余效'],['BCL-2抗凋亡']],
['chemo','趋化源','树突细胞 · 专属技能','主动技能','2 能量','在远端组织建立单一信号源，青色脉冲向外发散。','持续数回合改变双方靠近或远离信号源时的迁移费用。',['选定组织','信号建立','持续脉冲'],['CXCR3趋化']],
['mark','标记','树突细胞 · 被动技能','状态技能','自动触发','附近癌细胞被识别，在胞体头顶留下悬浮标记。','标记使下一次免疫能量损失增强，触发后移除。',['范围识别','自动赋予','状态维持'],['交叉呈递','免疫监视']],
['homing','血行转移','黑色素瘤 · 专属技能','主动技能','1 能量','从血管转移到空健康格，落地后展示邻格染癌扩散。','每世界回合一次，转移至合法落点并按规则感染邻格。',['血管启动','血行转移','落点染癌'],['肿瘤血管生成']],
['ossify','骨样硬化','骨肉瘤 · 专属技能','主动技能','2 能量','标记先落在脚下组织，经过回合积累后形成固化外壳。','标记与固化分属不同结算阶段；免疫停留可取消标记。',['落下标记','回合等待','固化完成'],['刚性屏障']],
['minimal','极简胞浆','小细胞肺癌 · 被动技能','被动技能','永久','细小胞体轻快迁入相邻健康组织，冷色速度线强调低消耗移动。','迁移至健康组织时降低费用；相邻移动与五格转移分开处理。',['轻量起步','相邻迁移','落点定殖'],['上皮—间质转化']]
].map(x=>({id:x[0],name:x[1],group:x[2],kind:x[3],cost:x[4],desc:x[5],effect:x[6],ph:x[7],cards:x[8]}));
const cards=[['repair','细胞膜修复','卡牌 · 护盾庇佑','即时','切角像素盾由大到小收束到细胞上。','下一次受到能量损失时减免伤害。'],['transfer','代谢耦联','卡牌 · 能量支援','即时','同阵营细胞之间定向输能，接收端回拢亮点。','选择其他细胞，按卡牌等级转移能量。'],['clone','克隆增殖','卡牌 · 组织变化','即时','健康组织依次转为癌组织，感染碎粒同步出现。','随机将相邻健康组织转为癌组织。']].map(x=>({id:'card_'+x[0],name:x[1],group:x[2],kind:'卡牌',cost:x[3],desc:x[4],effect:x[5],ph:['触发准备','粒子作用','结果保留'],cards:[]}));
let all=[...skills,...cards],current=skills[0],filter='all',query='';const $=id=>document.getElementById(id);function shown(){let a=filter==='cards'?cards:filter==='all'?all:skills;return a.filter(x=>`${x.name}${x.group}${x.desc}${x.effect}`.toLowerCase().includes(query.toLowerCase()))}function list(){let a=shown();$('result').textContent=`共 ${a.length} 项`;$('list').innerHTML=a.map(x=>`<button class="item ${x.id===current.id?'active':''}" data-id="${x.id}"><span class="item-icon">✦</span><span><b>${x.name}</b><small>${x.group}<br>${x.kind}</small></span></button>`).join('');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{current=all.find(x=>x.id===b.dataset.id);detail();list()})}function detail(){$('group').textContent=current.group;$('name').textContent=current.name;$('type').textContent=current.kind;$('cost').textContent=current.cost;$('desc').textContent=current.desc;$('effect').textContent=current.effect;$('phases').innerHTML=current.ph.map((x,i)=>`<button class="${i?'':'active'}">${x}</button>`).join('');document.querySelectorAll('#phases button').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('#phases button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('stageLabel').textContent=`动画阶段 ${i+1}/3 · ${current.ph[i]}`;$('orbit').style.animationDuration=`${1.8+i*1.2}s`});$('cards').innerHTML=(current.cards.length?current.cards:['暂无关联卡牌']).map(x=>`<div class="card"><b>${x}</b><small>${x==='暂无关联卡牌'?'等待补充关联。':'点击后可进入卡牌效果详情。'}</small></div>`).join('')}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;list()});$('search').oninput=e=>{query=e.target.value.trim();list()};detail();list();
</script></body></html>
