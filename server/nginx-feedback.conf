# nginx-feedback.conf —— 「反馈 bug」收件口的反代（issue #19，2026-09-11）
#
# 服务器进程里的 CWFeedbackHTTP 只绑 127.0.0.1:8612（云安全组只放了 80 / 8611），
# 由 nginx 站点 cellwar-patch（/etc/nginx/sites-enabled/cellwar-patch，server_name 124.221.78.13）
# 把 http://124.221.78.13/cellwar/feedback 反代进去。这段 location 放在 `location /cellwar/ { alias … }`
# 之后、`location / { return 404; }` 之前；精确匹配（=）优先于前缀匹配，所以补丁站那段不受影响。
#
# 装法（有 passwordless sudo）：
#   sudo sed -i '/location \/ { return 404; }/e cat /tmp/nginx-feedback.conf' /etc/nginx/sites-enabled/cellwar-patch
#   sudo nginx -t && sudo systemctl reload nginx
# 上传时 client_max_body_size 与 CWFeedbackHTTP.MAX_BODY（4 MB）配套，nginx 这边留 8m 的余量。
    location = /cellwar/feedback {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8612/feedback;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
